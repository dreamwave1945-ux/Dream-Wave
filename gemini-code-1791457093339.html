<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DreamWave OS // YouTube Video Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #020a0f;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
    }

    /* CRT SCANLINE OVERLAY */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 99;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .pulse-zoom {
      transition: transform 0.05s ease-out;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000f19; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- HEADER HUD -->
  <header class="h-12 border-b-2 border-[#00f0ff] bg-[#00141e]/90 flex items-center justify-between px-5 z-50 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
    <div class="font-bold text-base tracking-widest drop-shadow-[0_0_8px_#00f0ff]">DREAMWAVE // YOUTUBE VIDEO VISUALIZER</div>
    <div class="text-xs text-[#00ff88] animate-pulse">[ BEAT SYNC ENGINE: ACTIVE ]</div>
  </header>

  <!-- MAIN VIEWPORT -->
  <div class="flex-1 relative flex justify-center items-center overflow-hidden bg-black">
    
    <!-- YOUTUBE VIDEO BACKGROUND CONTAINER -->
    <div id="videoContainer" class="absolute inset-0 w-full h-full pointer-events-none flex items-center justify-center pulse-zoom">
      <div id="player" class="w-full h-full scale-125"></div>
    </div>

    <!-- OVERLAY CANVAS FOR VISUALIZER EFFECTS -->
    <canvas id="vizCanvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>

    <!-- FLOATING CONTROL PANEL -->
    <div class="absolute bottom-6 left-6 z-20 w-[420px] bg-[#000f19]/90 border-2 border-[#00f0ff] p-4 shadow-[0_0_25px_rgba(0,240,255,0.4)] backdrop-blur-md flex flex-col gap-3 text-xs">
      <div class="font-bold text-[#00f0ff] border-b border-[#00f0ff]/30 pb-1 flex justify-between items-center">
        <span>>>> VISUALIZER CONTROL PANEL</span>
        <button onclick="togglePanel()" class="text-[#ff0055] font-bold hover:text-white">[HIDE]</button>
      </div>

      <!-- INPUT YOUTUBE LINK / ID -->
      <div class="flex flex-col gap-1">
        <label class="font-bold text-[#00f0ff]/80">LINK ATAU ID YOUTUBE:</label>
        <div class="flex gap-2">
          <input type="text" id="ytUrlInput" value="https://youtu.be/XSoh40ZpYO0" placeholder="Paste link YouTube di sini..." class="flex-1 bg-black/80 border border-[#00f0ff]/50 px-2 py-1 text-[#00f0ff] focus:outline-none font-mono">
          <button onclick="loadYtVideo()" class="bg-[#00f0ff] text-black font-bold px-3 py-1 hover:bg-white transition-all">LOAD</button>
        </div>
      </div>

      <!-- VISUALIZER SETTINGS -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="font-bold text-[#00f0ff]/80 block mb-1">MODE EFEK:</label>
          <select id="vizMode" class="w-full bg-black border border-[#00f0ff]/50 text-[#00f0ff] p-1 focus:outline-none">
            <option value="pulse_ring">CIRCULAR PULSE RING</option>
            <option value="bars">SPECTRUM BARS</option>
            <option value="particles">NEON DUST PARTICLES</option>
            <option value="cyber_mask">DREAMWAVE MASK</option>
          </select>
        </div>

        <div>
          <label class="font-bold text-[#00f0ff]/80 block mb-1">TEMA WARNA:</label>
          <select id="vizTheme" class="w-full bg-black border border-[#00f0ff]/50 text-[#00f0ff] p-1 focus:outline-none">
            <option value="cyan">CYBER CYAN</option>
            <option value="red">DARK ROCK RED</option>
            <option value="pink">SYNTH PINK</option>
            <option value="green">MATRIX GREEN</option>
          </select>
        </div>
      </div>

      <!-- DENTUMAN & SENSITIVITAS SLIDERS -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <div class="flex justify-between font-bold text-[#00f0ff]/80">
            <span>TEMPO/BPM DETAK:</span>
            <span id="bpmVal" class="font-mono">130</span>
          </div>
          <input type="range" id="bpmInput" min="60" max="200" value="130" oninput="updateBpm(this.value)" class="w-full accent-[#00f0ff]">
        </div>

        <div>
          <div class="flex justify-between font-bold text-[#00f0ff]/80">
            <span>DENTUMAN BASS ZOOM:</span>
            <span id="zoomVal" class="font-mono">1.5x</span>
          </div>
          <input type="range" id="zoomInput" min="0" max="3" step="0.1" value="1.5" oninput="document.getElementById('zoomVal').innerText = this.value + 'x'" class="w-full accent-[#00f0ff]">
        </div>
      </div>

      <!-- PLAY / PAUSE BUTTON -->
      <div class="flex gap-2 pt-1 border-t border-[#00f0ff]/20">
        <button onclick="playYtVideo()" class="flex-1 bg-[#00f0ff] text-black font-bold py-1.5 hover:bg-white transition-all text-center">PLAY VIDEO</button>
        <button onclick="pauseYtVideo()" class="border border-[#00f0ff] text-[#00f0ff] font-bold px-4 py-1.5 hover:bg-[#00f0ff] hover:text-black transition-all">PAUSE</button>
      </div>
    </div>

    <!-- SHOW PANEL BUTTON (IF HIDDEN) -->
    <button id="showPanelBtn" onclick="togglePanel()" class="hidden absolute bottom-6 left-6 z-20 bg-[#00f0ff] text-black font-bold px-4 py-2 border border-[#00f0ff] shadow-[0_0_15px_rgba(0,240,255,0.4)] text-xs">
      [ SHOW CONTROL PANEL ]
    </button>

  </div>

  <!-- LOAD YOUTUBE IFRAME API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let isPlaying = false;
    let currentBpm = 130;
    let pulseIntensity = 0;
    let particleArray = [];

    // --- YOUTUBE API INITIALIZATION ---
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'XSoh40ZpYO0', // Default: Dream Wave - Blooms Behind The Mask
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'modestbranding': 1,
          'rel': 0,
          'showinfo': 0,
          'iv_load_policy': 3
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
      } else {
        isPlaying = false;
      }
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length == 11) ? match[2] : url;
    }

    function loadYtVideo() {
      const input = document.getElementById('ytUrlInput').value.trim();
      if (!input) return;
      const videoId = extractVideoId(input);
      if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
      }
    }

    function playYtVideo() {
      if (player && player.playVideo) player.playVideo();
    }

    function pauseYtVideo() {
      if (player && player.pauseVideo) player.pauseVideo();
    }

    function updateBpm(val) {
      currentBpm = parseInt(val);
      document.getElementById('bpmVal').innerText = val;
    }

    function togglePanel() {
      const panel = document.querySelector('.bg-\\[\\#000f19\\]\\/90');
      const showBtn = document.getElementById('showPanelBtn');
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        showBtn.classList.add('hidden');
      } else {
        panel.classList.add('hidden');
        showBtn.classList.remove('hidden');
      }
    }

    // --- BEAT SYNCHRONIZATION LOOP & CANVAS RENDER ENGINE ---
    let lastBeatTime = 0;

    function initParticles() {
      particleArray = [];
      for (let i = 0; i < 70; i++) {
        particleArray.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: Math.random() * 3 + 1,
          speedY: Math.random() * 1.5 + 0.5
        });
      }
    }

    function getThemeColor(theme, alpha = 1) {
      if (theme === 'red') return `rgba(255, 30, 60, ${alpha})`;
      if (theme === 'pink') return `rgba(255, 0, 170, ${alpha})`;
      if (theme === 'green') return `rgba(0, 255, 120, ${alpha})`;
      return `rgba(0, 240, 255, ${alpha})`; // Cyan
    }

    function renderVisualizer(now) {
      requestAnimationFrame(renderVisualizer);

      const canvas = document.getElementById('vizCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const mode = document.getElementById('vizMode').value;
      const theme = document.getElementById('vizTheme').value;
      const zoomFactor = parseFloat(document.getElementById('zoomInput').value);

      // Hitung interval detak berdasarkan BPM
      const beatInterval = (60 / currentBpm) * 1000;

      if (isPlaying) {
        if (now - lastBeatTime >= beatInterval) {
          lastBeatTime = now;
          pulseIntensity = 1.0; // Puncak detak
        }
      }

      // Decay efek dentuman perlahan
      pulseIntensity *= 0.92;

      // Efek Zoom/Dentuman Layar Video YouTube
      const videoContainer = document.getElementById('videoContainer');
      const zoomAmount = 1 + (pulseIntensity * 0.05 * zoomFactor);
      videoContainer.style.transform = `scale(${zoomAmount})`;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      if (mode === 'pulse_ring') {
        const radius = 100 + (pulseIntensity * 60 * zoomFactor);
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = getThemeColor(theme, 0.8);
        ctx.lineWidth = 6 + (pulseIntensity * 10);
        ctx.stroke();

        // Inner Aura
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = getThemeColor(theme, 0.2 * pulseIntensity);
        ctx.fill();
      }
      else if (mode === 'bars') {
        const numBars = 32;
        const barWidth = (canvas.width / numBars) * 0.8;
        let x = 0;
        for (let i = 0; i < numBars; i++) {
          const h = (Math.sin(i + now * 0.005) + 1) * 60 + (pulseIntensity * 120 * zoomFactor);
          ctx.fillStyle = getThemeColor(theme, 0.7);
          ctx.fillRect(x, canvas.height - h, barWidth - 4, h);
          x += (canvas.width / numBars);
        }
      }
      else if (mode === 'particles') {
        particleArray.forEach((p, idx) => {
          p.y -= p.speedY * (1 + pulseIntensity * 3);
          if (p.y < 0) p.y = canvas.height;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (1 + pulseIntensity * 2), 0, Math.PI * 2);
          ctx.fillStyle = getThemeColor(theme, 0.8);
          ctx.fill();
        });
      }
      else if (mode === 'cyber_mask') {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(1 + pulseIntensity * 0.25 * zoomFactor, 1 + pulseIntensity * 0.25 * zoomFactor);
        
        ctx.fillStyle = getThemeColor(theme, 0.85);
        ctx.beginPath();
        ctx.moveTo(-40, -25);
        ctx.lineTo(40, -25);
        ctx.lineTo(30, 35);
        ctx.lineTo(0, 50);
        ctx.lineTo(-30, 35);
        ctx.closePath();
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000000';
        ctx.fillRect(-26, -10, 16, 7);
        ctx.fillRect(10, -10, 16, 7);

        ctx.restore();
      }
    }

    window.onload = () => {
      initParticles();
      requestAnimationFrame(renderVisualizer);
    };
  </script>

</body>
</html>
